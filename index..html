  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #10b981;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      color: var(--primary);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 14px;
      color: var(--muted);
    }

    nav a:hover { color: var(--primary); }

    .hero {
      padding: 56px 0 28px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 24px;
      align-items: stretch;
    }

    .hero-card, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-card {
      padding: 32px;
    }

    .hero h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.1;
    }

    .hero p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 16px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline {
      background: #fff;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    .hero-side {
      display: grid;
      gap: 16px;
    }

    .info-box {
      padding: 22px;
    }

    .info-box h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .info-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }

    section {
      padding: 18px 0 28px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 28px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
